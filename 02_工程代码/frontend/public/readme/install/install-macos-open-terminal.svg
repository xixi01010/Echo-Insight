<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Echo Insight macOS 安装操作示意</title>
  <desc id="description">从 Finder 将完整仓库根目录拖入 Terminal，然后运行 setup-local.sh。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#102a56" flood-opacity="0.14"/>
    </filter>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#4f8cff"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="#f4f7fb"/>
  <rect x="0" y="0" width="14" height="900" fill="url(#accent)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
    <rect x="72" y="54" width="238" height="44" rx="22" fill="#e7efff"/>
    <text x="191" y="84" text-anchor="middle" font-size="24" font-weight="700" fill="#2563eb">macOS 操作示意</text>
    <text x="338" y="88" font-size="42" font-weight="750" fill="#102a56">从 Finder 进入仓库根目录，再用 Terminal 启动</text>
    <text x="74" y="134" font-size="20" fill="#64748b">非真机截图 · 菜单名称会随 macOS 语言与版本变化 · 后续配置提示与 Windows 相同</text>

    <g filter="url(#shadow)">
      <rect x="72" y="174" width="650" height="594" rx="22" fill="#ffffff"/>
      <rect x="72" y="174" width="650" height="58" rx="22" fill="#eef2f7"/>
      <rect x="72" y="210" width="650" height="22" fill="#eef2f7"/>
      <circle cx="108" cy="203" r="8" fill="#ff5f57"/>
      <circle cx="136" cy="203" r="8" fill="#febc2e"/>
      <circle cx="164" cy="203" r="8" fill="#28c840"/>
      <text x="397" y="210" text-anchor="middle" font-size="16" font-weight="650" fill="#526178">Finder · 下载</text>
      <rect x="94" y="252" width="606" height="72" rx="14" fill="#edf4ff" stroke="#b8d0ff"/>
      <path d="M119 273h22l8 9h32v25h-62z" fill="#4f8cff" opacity="0.92"/>
      <text x="196" y="286" font-size="20" font-weight="700" fill="#172033">Echo-Insight-main</text>
      <text x="196" y="309" font-size="14" fill="#64748b">完整解压后的最外层仓库文件夹</text>

      <text x="100" y="365" font-size="14" font-weight="700" fill="#8a97a9">根目录应同时看到</text>
      <g font-size="18" fill="#334155">
        <text x="114" y="410">▸ 02_工程代码</text>
        <text x="114" y="456">▸ README.md</text>
        <text x="114" y="502">▸ setup-local.cmd</text>
        <text x="114" y="548">▸ setup-local.ps1</text>
      </g>
      <rect x="96" y="572" width="596" height="54" rx="12" fill="#eaf2ff"/>
      <text x="114" y="606" font-size="19" font-weight="750" fill="#2563eb">▸ setup-local.sh</text>

      <path d="M424 654c58 0 104 23 140 65" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 10"/>
      <path d="m550 711 19 14-4-23" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="105" y="690" font-size="17" fill="#526178">在 Terminal 输入 cd 和一个空格，</text>
      <text x="105" y="719" font-size="17" fill="#526178">再把蓝色文件夹拖入终端。</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="754" y="174" width="772" height="594" rx="22" fill="#0b172b"/>
      <rect x="754" y="174" width="772" height="58" rx="22" fill="#13243d"/>
      <rect x="754" y="210" width="772" height="22" fill="#13243d"/>
      <circle cx="790" cy="203" r="8" fill="#ff5f57"/>
      <circle cx="818" cy="203" r="8" fill="#febc2e"/>
      <circle cx="846" cy="203" r="8" fill="#28c840"/>
      <text x="1140" y="210" text-anchor="middle" font-size="16" font-weight="650" fill="#b8cae6">Terminal · zsh</text>

      <text x="790" y="282" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#8aa4c8"># 1. 输入 cd 和空格，再从 Finder 拖入根目录</text>
      <text x="790" y="326" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#66c7ff">% cd /Users/you/Downloads/Echo-Insight-main</text>
      <text x="790" y="382" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#8aa4c8"># 2. 确认没有进入 02_工程代码 这一层</text>
      <text x="790" y="426" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#f4f8ff">% pwd</text>
      <text x="790" y="460" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#93e4bd">/Users/you/Downloads/Echo-Insight-main</text>
      <text x="790" y="504" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#f4f8ff">% ls README.md setup-local.sh "02_工程代码"</text>
      <text x="790" y="538" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#93e4bd">README.md   setup-local.sh   02_工程代码</text>
      <text x="790" y="594" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#8aa4c8"># 3. 启动交互式安装引导，不要双击 .sh</text>
      <text x="790" y="638" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="750" fill="#66c7ff">% sh ./setup-local.sh</text>
      <text x="790" y="684" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#93e4bd">[Echo Insight] 正在检查 Node.js 与锁定依赖…</text>
      <text x="790" y="720" font-size="16" fill="#f6c36b">需要 Node.js 20.19+ 或 22.12+；密钥输入不会显示在屏幕上。</text>
    </g>

    <rect x="72" y="806" width="1454" height="54" rx="14" fill="#ffffff" stroke="#dbe5f2"/>
    <text x="98" y="840" font-size="18" fill="#526178">可选：若 Finder“服务”中出现“新建位于文件夹位置的终端窗口”，也可以直接使用；找不到时按上面的拖拽方法即可。</text>
  </g>
</svg>
